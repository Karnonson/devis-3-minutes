# Cloud Run sends requests to port 8080.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  location = /version { default_type text/plain; add_header Cache-Control no-store; }
  location = /settings { default_type text/plain; add_header Cache-Control no-store; }
}
