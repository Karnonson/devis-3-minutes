<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devis 3 minutes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Liste des devis (page d'accueil) -->
  <section id="liste" class="ecran">
    <header class="barre">
      <span class="marque">Devis 3 minutes</span>
      <div class="actions">
        <a class="bouton secondaire" id="ouvrir-reglages" href="#reglages">Réglages</a>
        <button type="button" class="bouton principal" id="nouveau-devis">Nouveau devis</button>
      </div>
    </header>
    <main class="page-corps">
      <h1 class="titre-ecran">Devis</h1>
      <div class="liste-vide" id="liste-vide" hidden>
        <p class="liste-vide-titre">Aucun devis</p>
        <button type="button" class="bouton principal" id="nouveau-devis-vide">Nouveau devis</button>
      </div>
      <table class="liste-devis" id="liste-devis" hidden>
        <thead>
          <tr>
            <th>Numéro</th>
            <th>Client</th>
            <th>Date</th>
            <th class="col-nombre">Total TTC</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="liste-lignes"></tbody>
      </table>
    </main>
  </section>

  <!-- Réglages (tranche 03) -->
  <section id="reglages" class="ecran" hidden>
    <header class="barre">
      <div class="barre-gauche">
        <a class="retour" href="#">← Liste des devis</a>
        <span class="marque">Réglages</span>
      </div>
    </header>
    <main class="page-corps">
      <h1 class="titre-ecran">Réglages</h1>
      <p class="discret">Bientôt : vos coordonnées, votre SIRET et vos conditions se régleront ici.</p>
    </main>
  </section>

  <!-- Écran du devis -->
  <section id="devis" class="ecran" hidden>
    <header class="barre">
      <div class="barre-gauche">
        <a class="retour" id="retour-liste" href="#">← Liste des devis</a>
        <span class="marque" id="devis-numero-barre"></span>
      </div>
      <div class="actions">
        <button type="button" class="bouton principal" id="sortir-pdf">Sortir le PDF</button>
      </div>
    </header>

    <div class="devis-corps">
      <form class="saisie" id="saisie" autocomplete="off" onsubmit="return false">
        <fieldset class="bloc">
          <legend>Client</legend>
          <label class="champ">
            <span>Nom</span>
            <input type="text" id="client-nom" placeholder="Acme SARL">
          </label>
          <label class="champ">
            <span>Contact <em>facultatif</em></span>
            <input type="text" id="client-contact" placeholder="Marie Martin">
          </label>
          <label class="champ">
            <span>Adresse</span>
            <textarea id="client-adresse" rows="3" placeholder="12 rue des Lilas&#10;69003 Lyon"></textarea>
          </label>
        </fieldset>

        <fieldset class="bloc">
          <legend>Prestations</legend>
          <ol class="lignes" id="lignes"></ol>
          <button type="button" class="bouton secondaire" id="ajouter-ligne">Ajouter une ligne</button>
        </fieldset>
      </form>

      <div class="apercu" id="apercu-zone">
        <article class="feuille" id="feuille" aria-label="Aperçu du devis"></article>
      </div>
    </div>
  </section>

  <template id="modele-ligne">
    <li class="ligne">
      <div class="ligne-tete">
        <span class="ligne-rang"></span>
        <div class="ligne-outils">
          <button type="button" class="icone" data-action="monter" aria-label="Monter la ligne" title="Monter">↑</button>
          <button type="button" class="icone" data-action="descendre" aria-label="Descendre la ligne" title="Descendre">↓</button>
          <button type="button" class="icone danger" data-action="supprimer" aria-label="Supprimer la ligne" title="Supprimer">✕</button>
        </div>
      </div>
      <label class="champ">
        <span>Titre</span>
        <input type="text" data-champ="titre" placeholder="Atelier de cadrage">
      </label>
      <label class="champ">
        <span>Détail <em>facultatif</em></span>
        <textarea data-champ="detail" rows="2" placeholder="Une demi-journée sur place, compte rendu écrit."></textarea>
      </label>
      <div class="ligne-chiffres">
        <label class="champ">
          <span>Qté</span>
          <input type="text" inputmode="decimal" data-champ="quantite" placeholder="1">
        </label>
        <label class="champ">
          <span>PU HT (€)</span>
          <input type="text" inputmode="decimal" data-champ="prix" placeholder="0,00">
        </label>
        <div class="champ total-ligne">
          <span>Total HT</span>
          <output data-champ="total">0,00&nbsp;€</output>
        </div>
      </div>
    </li>
  </template>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
